<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠挑戰 - Whack-A-Mole!</title>
    <style>
        :root {
            --grass-color: #7cfc00;
            --soil-color: #8b4513;
            --mole-color: #a0522d;
            --ui-bg: rgba(255, 255, 255, 0.9);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #a8e063, #56ab2f);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><path fill="%23666" d="M19,2L14,6.5V9H10V11H14V22L19,17.5V2Z"/></svg>') 16 16, auto;
        }

        body:active {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" style="transform: rotate(-30deg); transform-origin: center;"><path fill="%23666" d="M19,2L14,6.5V9H10V11H14V22L19,17.5V2Z"/></svg>') 16 16, auto;
        }

        h1 {
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-top: 20px;
            font-size: 3rem;
        }

        .stats {
            background: var(--ui-bg);
            padding: 10px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            gap: 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .score span, .timer span {
            color: #e67e22;
        }

        .game-container {
            width: 600px;
            height: 400px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
            perspective: 1000px;
        }

        .hole {
            position: relative;
            overflow: hidden;
            background: #4d260a;
            border-radius: 50% / 20%;
            box-shadow: inset 0 10px 0 0 rgba(0,0,0,0.5), 0 5px 0 0 #3a1c07;
        }

        /* 地鼠 */
        .mole {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 90%;
            background: var(--mole-color);
            border-radius: 50% 50% 0 0;
            transition: top 0.2s ease-out;
            cursor: pointer;
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.2);
        }

        /* 地鼠的面部細節 */
        .mole::before {
            content: '';
            position: absolute;
            top: 25%;
            left: 20%;
            width: 10px;
            height: 10px;
            background: black;
            border-radius: 50%;
            box-shadow: 35px 0 0 black;
        }

        .mole::after {
            content: '';
            position: absolute;
            top: 45%;
            left: 45%;
            width: 12px;
            height: 8px;
            background: #ff9999;
            border-radius: 50%;
        }

        .hole.up .mole {
            top: 15%;
        }

        /* 覆蓋層 (開始/結束) */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        button {
            background: #e67e22;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, background 0.3s;
        }

        button:hover {
            background: #d35400;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 650px) {
            .game-container {
                width: 90%;
                height: 300px;
            }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <h1>打地鼠挑戰！</h1>

    <div class="stats">
        <div class="score">分數: <span>0</span></div>
        <div class="timer">剩餘時間: <span>30</span>s</div>
    </div>

    <div class="game-container">
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
    </div>

    <div id="overlay">
        <div class="modal">
            <h2 id="modal-title">準備好挑戰了嗎？</h2>
            <p id="modal-desc">點擊地鼠來得分，限時 30 秒！</p>
            <button onclick="startGame()">開始遊戲</button>
        </div>
    </div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreBoard = document.querySelector('.score span');
        const timerBoard = document.querySelector('.timer span');
        const moles = document.querySelectorAll('.mole');
        const overlay = document.getElementById('overlay');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');

        let lastHole;
        let timeUp = false;
        let score = 0;
        let countdown;
        let timeLeft = 30;

        // 產生隨機時間
        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        // 隨機選取一個洞穴
        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        // 地鼠冒出來
        function peep() {
            // 隨著分數增加，地鼠縮回去的速度會微幅變快
            const difficultyOffset = Math.min(score * 5, 400); 
            const time = randomTime(600 - difficultyOffset, 1200 - difficultyOffset);
            const hole = randomHole(holes);
            
            hole.classList.add('up');
            
            setTimeout(() => {
                hole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        function startGame() {
            // 初始化
            score = 0;
            timeLeft = 30;
            scoreBoard.textContent = 0;
            timerBoard.textContent = timeLeft;
            timeUp = false;
            overlay.classList.add('hidden');

            peep();

            // 計時器
            countdown = setInterval(() => {
                timeLeft--;
                timerBoard.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            timeUp = true;
            modalTitle.textContent = "遊戲結束！";
            modalDesc.textContent = `你的最終分數是 ${score} 分！`;
            overlay.classList.remove('hidden');
        }

        function bonk(e) {
            if(!e.isTrusted) return; // 防止作弊（模擬點擊）
            score++;
            this.parentNode.classList.remove('up');
            scoreBoard.textContent = score;
        }

        moles.forEach(mole => mole.addEventListener('click', bonk));
    </script>
</body>
</html>
